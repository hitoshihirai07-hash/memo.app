<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ひとこと — 個人ノート</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="ひとこと ホーム">ひとこと<span class="brand-dot" aria-hidden="true">.</span></a>
      <nav aria-label="メイン">
        <button id="write-tab" class="nav-button active" aria-current="page">書く</button>
        <button id="history-tab" class="nav-button">過去メモ</button>
      </nav>
    </div>
  </header>
  <main>
    <section id="editor-view" aria-labelledby="editor-heading">
      <div class="heading-row">
        <div><p id="editor-date" class="date"></p><h1 id="editor-heading">今日のメモ</h1></div>
        <button id="today-button" class="text-button" hidden>今日に戻る</button>
      </div>
      <label for="note-body" class="sr-only">メモ本文</label>
      <textarea id="note-body" autofocus placeholder="思いついたことを、そのまま。" maxlength="100000" spellcheck="false" disabled></textarea>
      <div class="save-row">
        <div><p id="save-status" class="status" role="status">メモを読み込んでいます…</p><p id="count" class="count">0文字</p></div>
        <button id="save-button" class="primary" disabled>保存する</button>
      </div>
      <div id="editor-error" class="error" role="alert" hidden></div>
      <div id="recovery-actions" class="recovery" hidden>
        <button id="retry-button" class="secondary">再読み込み</button>
        <button id="latest-button" class="secondary" hidden>最新のメモを見る</button>
        <button id="copy-button" class="secondary">入力をMarkdownに保存</button>
      </div>
      <footer class="editor-footer">
        <div class="export-links"><button id="export-note" class="text-button" disabled>Markdown</button><button id="export-json-editor" class="text-button">JSONで書き出す</button></div>
        <button id="delete-button" class="text-button danger" hidden>削除する</button>
      </footer>
      <p class="storage-caption">保存先はこの端末です。別の端末へはJSONで受け渡しできます。</p>
    </section>
    <section id="history-view" aria-labelledby="history-heading" hidden>
      <div class="history-heading"><h1 id="history-heading">過去メモ</h1><button id="export-all" class="text-button">Markdown</button></div>
      <div class="backup-actions"><button id="export-json" class="text-button">JSONで書き出す</button><button id="import-json" class="text-button">JSONを読み込む</button></div>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <form id="search-form" role="search">
        <label for="search" class="sr-only">メモを検索</label>
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input type="search" id="search" placeholder="メモを検索" maxlength="200" autocomplete="off">
      </form>
      <p id="list-status" class="list-status" role="status"></p>
      <div id="history-error" class="error" role="alert" hidden></div>
      <button id="list-retry" class="secondary" hidden>再読み込み</button>
      <ul id="notes-list" class="notes-list"></ul>
      <button id="load-more" class="secondary load-more" hidden>もっと見る</button>
    </section>
  </main>
  <dialog id="delete-dialog" aria-labelledby="delete-heading">
    <h2 id="delete-heading">このメモを削除しますか？</h2>
    <p id="delete-date"></p><p class="dialog-caption">削除したメモは元に戻せません。</p>
    <div class="dialog-actions"><button id="cancel-delete" class="secondary">キャンセル</button><button id="confirm-delete" class="delete-primary">削除する</button></div>
  </dialog>
  <dialog id="import-dialog" aria-labelledby="import-heading">
    <h2 id="import-heading">JSONのメモを読み込む</h2>
    <p id="import-summary" class="dialog-caption"></p>
    <p id="import-policy" class="dialog-caption">同じ日付のメモは、この端末の本文を残します。</p>
    <label id="overwrite-option" class="overwrite-option"><input type="checkbox" id="overwrite">同じ日付をファイルの本文に置き換える</label>
    <p id="import-dialog-error" class="error" role="alert" hidden></p>
    <div class="dialog-actions"><button id="cancel-import" class="secondary">キャンセル</button><button id="confirm-import" class="primary">読み込む</button></div>
  </dialog>
  <noscript>このノートを使うにはJavaScriptを有効にしてください。</noscript>
</body>
</html>
